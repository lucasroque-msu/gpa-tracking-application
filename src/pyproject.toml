[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sls_gpa_calculator_lib"
version = "0.0.1"
authors = [
  { name="Samuel Simon" },
  { name="Lucas Roque" },
  { name="Sagun Shrestha" },
]
description = "Calculates a credit-weighted GPA from letter grades"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/lucasroque-msu/gpa-tracking-application"
"Bug Tracker" = "https://github.com/lucasroque-msu/gpa-tracking-application/issues"
